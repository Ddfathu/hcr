version: '3.8'

services:
  hcr-server:
    build: .
    container_name: hcr-server
    restart: always
    environment:
      - SSH_USER=root
      - SSH_PASS=PasswordHCR123
      - PORT=8880
      - TRANSPORT=plain
      - MAX_DOWNLOAD_FRAME=1024
      - DOWNLOAD_POLL_TIMEOUT=10s
    ports:
      - "8880:8880"
      - "2222:22"
